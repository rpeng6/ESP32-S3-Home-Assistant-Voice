## Minimal device stub for the ESP32-S3 voice assistant package.
## Copy this file into your ESPHome config directory, rename it after the device
## (e.g. livingroom-va.yaml), and fill in the substitutions for YOUR board.
##
## Package: github://rpeng6/ESP32-S3-Home-Assistant-Voice/ESP32-S3-Voice-Assistant.yaml

substitutions:
  # ---- device identity -------------------------------------------------------
  name: livingroom-va                 # ESPHome node name (no spaces, used for OTA/mDNS)
  friendly_name: Living Room VA
  hidden_ssid: "false"                # "true" only if your SSID is hidden

  # ---- credentials (keep these in secrets.yaml instead of here) --------------
  ota_password: !secret ota_password
  key_encryption: !secret api_encryption_key

  # ---- I2S pin map: OUTPUT side (amplifier / DAC) ----------------------------
  i2s_lrclk: GPIO16                   # LRCLK / WS for the amplifier
  i2s_bclk: GPIO15                    # BCLK / SCK for the amplifier
  spk: GPIO07                         # amplifier data in (DIN)

  # ---- I2S pin map: INPUT side (microphone) ----------------------------------
  i2s_ws: GPIO04                      # microphone word select
  i2s_sck: GPIO05                     # microphone bit clock
  mic: GPIO06                         # microphone data out

  # ---- misc ------------------------------------------------------------------
  ledpin: GPIO48                      # status LED (WS2812)
  vol_up: GPIO47                      # optional volume buttons, remove if unused
  vol_down: GPIO21

  # ---- voice assistant phase ids (do not change) -----------------------------
  voice_assist_idle_phase_id: '1'
  voice_assist_waiting_for_command_phase_id: '2'
  voice_assist_listening_for_command_phase_id: '3'
  voice_assist_thinking_phase_id: '4'
  voice_assist_replying_phase_id: '5'
  voice_assist_not_ready_phase_id: '10'
  voice_assist_error_phase_id: '11'
  voice_assist_muted_phase_id: '12'

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  min_version: 2025.5.1

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  cpu_frequency: 240MHz
  flash_size: 16MB
  framework:
    type: esp-idf
    version: recommended

psram:
  mode: octal
  speed: 80MHz

wifi:
  id: wifi_id
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: none      # LIGHT modem sleep adds 100-200 ms of jitter

logger:
  level: INFO                # DEBUG on a VA build costs CPU and heap

api:
  id: api_id
  encryption:
    key: ${key_encryption}

ota:
  - platform: esphome
    id: ota_esphome
    password: ${ota_password}

packages:
  Nabu Casa.Home Assistant Voice PE: github://rpeng6/ESP32-S3-Home-Assistant-Voice/ESP32-S3-Voice-Assistant.yaml
